name: Build HFs Attendance APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Apply launcher icon
        run: |
          base64 -d launcher_icon_v32.b64 > /tmp/ic_launcher_full.webp
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p app/src/main/res/mipmap-$d
            cp /tmp/ic_launcher_full.webp app/src/main/res/mipmap-$d/ic_launcher_full.webp
            cp /tmp/ic_launcher_full.webp app/src/main/res/mipmap-$d/ic_launcher_full_round.webp
          done
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HFs_Attendance_Application_v3.4.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HFs-Attendance-Application-v3.4-APK
          path: HFs_Attendance_Application_v3.4.apk
