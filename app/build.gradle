plugins { id 'com.android.application' }

android {
    namespace 'org.sedki.locationcheckin'
    compileSdk 35

    defaultConfig {
        applicationId 'org.sedki.hfsattendance'
        minSdk 23
        targetSdk 35
        versionCode 39
        versionName '3.9'
    }

    packaging {
        resources {
            excludes += ['META-INF/LICENSE.md','META-INF/NOTICE.md','META-INF/LICENSE','META-INF/NOTICE']
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.sun.mail:android-mail:1.6.7'
    implementation 'com.sun.mail:android-activation:1.6.7'
}
